<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; cursor: crosshair; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 15px; left: 15px;
            color: #fff; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="aquarium"></canvas>
    <div id="ui">Click to drop food | Fish: <span id="fishCount">0</span></div>
    <script>
    const canvas = document.getElementById('aquarium');
    const ctx = canvas.getContext('2d');
    const fishCountEl = document.getElementById('fishCount');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6fb7','#ff9a76','#a66cff','#44cf6c'];

    class Fish {
        constructor(x, y) {
            this.x = x ?? Math.random() * canvas.width;
            this.y = y ?? Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.size = 14 + Math.random() * 18;
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.tailPhase = Math.random() * Math.PI * 2;
            this.targetFood = null;
        }

        findFood(foods) {
            if (this.targetFood && foods.includes(this.targetFood)) return;
            this.targetFood = null;
            let closest = Infinity;
            for (const f of foods) {
                const dx = f.x - this.x;
                const dy = f.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < closest && dist < 300) {
                    closest = dist;
                    this.targetFood = f;
                }
            }
        }

        update(foods) {
            this.tailPhase += 0.15;
            this.findFood(foods);

            if (this.targetFood) {
                const dx = this.targetFood.x - this.x;
                const dy = this.targetFood.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < this.size * 0.6) {
                    this.targetFood.eaten = true;
                    this.targetFood = null;
                    return;
                }
                const speed = 3.5;
                this.vx += (dx / dist) * 0.15;
                this.vy += (dy / dist) * 0.15;
            } else {
                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 0.8;
                    this.vy += (Math.random() - 0.5) * 0.4;
                }
            }

            const maxSpeed = this.targetFood ? 4 : 2.5;
            const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            if (spd > maxSpeed) {
                this.vx = (this.vx / spd) * maxSpeed;
                this.vy = (this.vy / spd) * maxSpeed;
            }

            this.x += this.vx;
            this.y += this.vy;

            const margin = 50;
            if (this.x < margin) this.vx += 0.3;
            if (this.x > canvas.width - margin) this.vx -= 0.3;
            if (this.y < margin) this.vy += 0.3;
            if (this.y > canvas.height - margin) this.vy -= 0.3;
        }

        draw() {
            const facingRight = this.vx >= 0;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(facingRight ? 1 : -1, 1);

            const tailWag = Math.sin(this.tailPhase) * 4;
            const s = this.size;

            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(s, 0);
            ctx.quadraticCurveTo(s * 0.5, -s * 0.45, -s * 0.2, -s * 0.15);
            ctx.lineTo(-s * 0.6 + tailWag, -s * 0.35);
            ctx.lineTo(-s * 0.45, 0);
            ctx.lineTo(-s * 0.6 + tailWag, s * 0.35);
            ctx.lineTo(-s * 0.2, s * 0.15);
            ctx.quadraticCurveTo(s * 0.5, s * 0.45, s, 0);
            ctx.fill();

            ctx.fillStyle = this.targetFood ? '#ff2222' : '#ffffff';
            ctx.beginPath();
            ctx.arc(s * 0.55, -s * 0.1, s * 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(s * 0.57, -s * 0.1, s * 0.05, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    class Food {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vy = 0.5;
            this.eaten = false;
            this.opacity = 1;
            this.sinkY = Math.min(canvas.height - 30, y + 80 + Math.random() * 120);
        }
        update() {
            if (this.y < this.sinkY) {
                this.y += this.vy;
                this.vy *= 1.01;
                this.vy = Math.min(this.vy, 1.5);
            }
            this.x += Math.sin(Date.now() * 0.002 + this.x) * 0.15;
        }
        draw() {
            if (this.eaten) return;
            ctx.fillStyle = `rgba(180,130,60,${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const fishes = Array.from({ length: 5 }, () => new Fish());
    const foods = [];
    fishCountEl.textContent = fishes.length;

    canvas.addEventListener('click', e => {
        foods.push(new Food(e.clientX, e.clientY));
    });

    const bubbles = [];
    function spawnBubble() {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: canvas.height + 10,
            r: 2 + Math.random() * 4,
            speed: 0.3 + Math.random() * 0.8,
            wobble: Math.random() * Math.PI * 2
        });
    }

    function drawBg() {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#001427');
        grad.addColorStop(0.5, '#003554');
        grad.addColorStop(1, '#006d77');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#004e4a';
        for (let i = 0; i < 12; i++) {
            const bx = (i * canvas.width / 11) + Math.sin(Date.now() * 0.001 + i) * 8;
            ctx.beginPath();
            ctx.moveTo(bx, canvas.height);
            ctx.quadraticCurveTo(bx + 15, canvas.height - 40 - Math.sin(Date.now() * 0.002 + i) * 10, bx + 5, canvas.height - 80);
            ctx.quadraticCurveTo(bx + 30, canvas.height - 45, bx + 20, canvas.height);
            ctx.fill();
        }
    }

    function drawBubbles() {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        for (const b of bubbles) {
            b.wobble += 0.03;
            b.x += Math.sin(b.wobble) * 0.4;
            b.y -= b.speed;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }
        for (let i = bubbles.length - 1; i >= 0; i--) {
            if (bubbles[i].y < -10) bubbles.splice(i, 1);
        }
    }

    function loop() {
        drawBg();

        if (Math.random() < 0.02) spawnBubble();
        drawBubbles();

        for (const f of fishes) {
            f.update(foods);
            f.draw();
        }

        for (const fd of foods) {
            fd.update();
            fd.draw();
        }

        for (let i = foods.length - 1; i >= 0; i--) {
            if (foods[i].eaten || foods[i].opacity <= 0) {
                foods.splice(i, 1);
            }
        }

        requestAnimationFrame(loop);
    }

    loop();
    </script>
</body>
</html>
